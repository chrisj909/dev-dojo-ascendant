name: Migrate

# Migrations run HERE, not in the Vercel build command.
#
# A build can be skipped by an Ignored Build Step, auto-cancelled when another
# push lands on the same branch, or reverted by Instant Rollback — and each of
# those leaves the schema and the code disagreeing while the deploy still
# reports success. Running migrations as their own gated step makes "did the
# migration run" a question with an answer.

on:
  push:
    branches: [main]
    paths:
      - 'drizzle/**'
      - 'lib/db/schema.ts'
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to Neon
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Without this the run dies partway through `drizzle-kit migrate` with a
      # connection error, which reads like a database problem rather than a
      # missing secret.
      - name: Check the connection string is configured
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "${DATABASE_URL_UNPOOLED}" ]; then
            echo "::error::Repository secret DATABASE_URL_UNPOOLED is not set, so migrations cannot run."
            echo ""
            echo "This is the Neon DIRECT connection string — the one whose host does NOT contain '-pooler'."
            echo "Add it with:"
            echo "  gh secret set DATABASE_URL_UNPOOLED"
            echo ""
            echo "Until it is set, schema changes merged to main will NOT reach the database,"
            echo "and the deployed code will expect a schema that is not there."
            exit 1
          fi
          echo "connection string present"

      - name: Apply migrations
        env:
          # The DIRECT endpoint. Neon's pooled host is PgBouncer in transaction
          # mode and is not a reliable place to run DDL or CREATE ROLE.
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npm run db:migrate

      - name: Seed region reference data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npm run db:seed

      # The gate. If row-level security is not in force after a migration, the
      # job fails loudly rather than leaving every tenant readable.
      - name: Verify row-level security
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npm run verify:rls
